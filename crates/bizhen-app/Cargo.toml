[package]
name = "bizhen"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "bizhen"
path = "src/main.rs"

[dependencies]
# 界面一定需要串口（打印按钮），因此显式打开 serial 特性
bizhen-core = { workspace = true, features = ["serial"] }
gpui = "0.2"
rfd = "0.17.2"
